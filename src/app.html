/* ---------- render ---------- */
let rafId = 0;
function scheduleRender() { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(render); }
function render() {
  const a = document.activeElement;
  const id = a && a.id;
  let ss = null, se = null;
  try { ss = a.selectionStart; se = a.selectionEnd; } catch (e) { /* not a text field */ }
  const mb = document.getElementById('m-body'), ll = document.querySelector('.lib-list');
  const mScroll = mb ? mb.scrollTop : 0, lScroll = ll ? ll.scrollTop : 0;
  $app.innerHTML = view();
  const nb = document.getElementById('m-body'); if (nb && mb) nb.scrollTop = mScroll;
  const nl = document.querySelector('.lib-list'); if (nl && ll) nl.scrollTop = lScroll;
  if (id) {
    const el = document.getElementById(id);
    if (el) { el.focus({ preventScroll: true }); try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) { /* not selectable */ } }
  } else if (S.modal && !document.querySelector('.modal')?.contains(document.activeElement)) {
    document.querySelector('.modal .x')?.focus({ preventScroll: true });
  }
  if (S.route === 'a-session') saveSession();
  if (S.wkScroll) {
    S.wkScroll = false;
    const anchor = document.getElementById('wk-steps'), top = document.querySelector('.top');
    if (anchor) window.scrollTo({ top: Math.max(0, anchor.getBoundingClientRect().top + window.scrollY - (top ? top.getBoundingClientRect().height : 0) - 10) });
  }
  if (S.tpScroll) { S.tpScroll = false; document.querySelector('.tempo')?.scrollIntoView({ block: 'center' }); }
  if (S.aSession && S.aSession.rest || S.tempo) ensureTicker();
  syncWake();
}

/* ---------- drag and drop (builder) ---------- */
let drag = null, dropAt = null;
function clearMarks() { document.querySelectorAll('.drop-before, .drop-end, .drop-over').forEach(el => el.classList.remove('drop-before', 'drop-end', 'drop-over')); }
function endDrag() { drag = null; dropAt = null; clearMarks(); document.body.classList.remove('is-dragging'); document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging')); }
document.addEventListener('dragstart', ev => {
  const el = ev.target.closest && ev.target.closest('[data-drag]');
  if (!el || S.route !== 'builder') return;
  drag = el.dataset.drag === 'lib' ? { kind: 'lib', id: el.dataset.id } : { kind: 'item', bi: +el.dataset.bi, ii: +el.dataset.ii };
  ev.dataTransfer.effectAllowed = drag.kind === 'lib' ? 'copy' : 'move';
  try { ev.dataTransfer.setData('text/plain', drag.kind === 'lib' ? drag.id : 'item'); } catch (e) { /* ignore */ }
  if (drag.kind === 'item') { const li = el.closest('.pitem'); if (li) { try { ev.dataTransfer.setDragImage(li, 20, 20); } catch (e) { /* ignore */ } setTimeout(() => li.classList.add('dragging'), 0); } }
  document.body.classList.add('is-dragging');
});
document.addEventListener('dragover', ev => {
  if (!drag) return;
  if (ev.clientY < 140) window.scrollBy(0, -14); else if (ev.clientY > window.innerHeight - 80) window.scrollBy(0, 14);
  const block = ev.target.closest && ev.target.closest('.block');
  clearMarks();
  if (!block) { dropAt = null; return; }
  ev.preventDefault();
  ev.dataTransfer.dropEffect = drag.kind === 'lib' ? 'copy' : 'move';
  const items = [...block.querySelectorAll('.pitem')];
  let idx = items.length;
  for (let i = 0; i < items.length; i++) { const r = items[i].getBoundingClientRect(); if (ev.clientY < r.top + r.height / 2) { idx = i; break; } }
  dropAt = { bi: +block.dataset.bi, idx };
  block.classList.add('drop-over');
  if (idx < items.length) items[idx].classList.add('drop-before'); else block.classList.add('drop-end');
});
document.addEventListener('drop', ev => {
  if (!drag || !dropAt) { endDrag(); return; }
  ev.preventDefault();
  const day = S.draft.sessions[S.bDay], to = day.blocks[dropAt.bi];
  let idx = dropAt.idx;
  if (drag.kind === 'lib') {
    const e = ex(drag.id);
    if (e) { to.items.splice(idx, 0, itemFromExercise(e)); S.bBlock = dropAt.bi; endDrag(); toast(`${e.name} added to ${to.name || day.name}`); return; }
  } else {
    const from = day.blocks[drag.bi];
    if (from) {
      const [it] = from.items.splice(drag.ii, 1);
      if (drag.bi === dropAt.bi && drag.ii < idx) idx--;
      to.items.splice(idx, 0, it);
    }
  }
  endDrag(); render();
});
document.addEventListener('dragend', () => { if (drag) { endDrag(); } });

/* ---------- actions ---------- */
function confirmThen(title, text, yes, fn) { S.modal = { type: 'confirm', title, text, yes, fn }; render(); }
function addToTarget(e) {
  const day = S.draft.sessions[S.bDay];
  if (!day.blocks.length) day.blocks.push(newBlock(1));
  const b = day.blocks[Math.min(S.bBlock, day.blocks.length - 1)];
  b.items.push(itemFromExercise(e));
  toast(`${e.name} added to ${b.name || day.name}`, '', 1600);
}

const A = {
  'b-diff': el => { const d = S.draft, k = el.dataset.ex, v = Number(el.dataset.v); d._diff[k] = Number(d._diff[k]) === v ? 0 : v; render(); },
  'diff-open': el => { const a = S.data.athletes.get(el.dataset.id); S.modal = { type: 'diff', athleteId: a.id, progId: programsFor(a.id)[0]?.id, map: { ...(a.difficulty || {}) } }; render(); },
  'd-prog': el => { S.modal.progId = el.dataset.id; render(); const mb = document.getElementById('m-body'); if (mb) mb.scrollTop = 0; },
  'd-set': el => { const m = S.modal, k = el.dataset.ex, v = Number(el.dataset.v); m.map[k] = Number(m.map[k]) === v ? 0 : v; render(); },
  'd-save': async () => {
    const m = S.modal, changes = {};
    for (const k of Object.keys(m.map)) if ((Number(m.map[k]) || 0) !== diffOf(m.athleteId, k)) changes[k] = Number(m.map[k]) || 0;
    if (!Object.keys(changes).length) return;
    S.saving = true; render();
    const ok = await write(() => S.db.collection('athletes').doc(m.athleteId).update({ difficulty: changes }), `Saved ${Object.keys(changes).length} difficulty rating${Object.keys(changes).length === 1 ? '' : 's'}`);
    S.saving = false;
    if (ok) S.modal = null;
    render();
  },
  login: async () => {
    const L = S.login, username = String(L.username || '').trim(), password = L.pw || '';
    if (!username || !password) { L.err = 'Enter your username and password.'; render(); return; }
    L.busy = true; L.err = ''; render();
    try {
      const r = await api('POST', '/api/login', { username, password }, { quiet401: true });
      startData();
      signedIn(r.user);
    } catch (e) {
      L.busy = false; L.pw = '';
      L.err = e.code === 'rate_limited' ? 'Too many tries. Wait 15 minutes, then try again.'
        : e.code === 'unavailable' ? 'Can’t reach the server. Check your connection and try again.'
        : e.status === 401 ? 'That username or password isn’t right.' : 'Couldn’t sign in. Try again in a moment.';
      render(); setTimeout(() => document.getElementById('login-pw')?.focus(), 0);
    }
  },
  logout: async () => { try { await api('POST', '/api/logout', {}, { quiet401: true }); } catch (e) { /* signed out locally anyway */ } clearAllSessions(); S.tempo = null; signedOut(); },
  logins: () => { S.modal = { type: 'logins', pwFor: null, pw: '', add: { role: 'athlete', athleteId: athletes().find(a => ![...S.data.users.values()].some(u => u.athleteId === a.id))?.id || athletes()[0]?.id || '', name: '', username: '', pw: '' } }; render(); },
  'pw-open': el => { S.modal.pwFor = el.dataset.id; S.modal.pw = ''; render(); setTimeout(() => document.getElementById('pw-new')?.focus(), 0); },
  'pw-cancel': () => { S.modal.pwFor = null; S.modal.pw = ''; render(); },
  'pw-save': async el => {
    const u = S.data.users.get(el.dataset.id), pw = S.modal.pw || '';
    if (!u) return;
    if (pw.length < MIN_PW) return toast(`Use at least ${MIN_PW} characters for the password.`, 'error');
    if (await write(() => api('POST', `/api/users/${encodeURIComponent(u.id)}/password`, { password: pw }), `Password changed for ${first(u.name)}`)) { S.modal.pwFor = null; S.modal.pw = ''; render(); }
  },
  'login-add': async () => {
    const a = S.modal.add;
    const username = String(a.username || '').trim().toLowerCase();
    const name = a.role === 'athlete' ? athName(a.athleteId) : String(a.name || '').trim();
    if (a.role === 'athlete' && !S.data.athletes.has(a.athleteId)) return toast('Choose which athlete this login is for.', 'error');
    if (!name) return toast('Add a name for this login.', 'error');
    if (!/^[a-z0-9._-]{2,30}$/.test(username)) return toast('Use a username of 2–30 letters or numbers, without spaces.', 'error');
    if ([...S.data.users.values()].some(u => u.username === username)) return toast('That username is already taken.', 'error');
    if (String(a.pw || '').length < MIN_PW) return toast(`Use at least ${MIN_PW} characters for the password.`, 'error');
    const body = { name, username, role: a.role, password: a.pw, athleteId: a.role === 'athlete' ? a.athleteId : undefined };
    if (await write(async () => { await api('POST', '/api/users', body); await S.db.sync(); }, `Login added for ${first(name)}`)) { S.modal.add = { role: 'athlete', athleteId: '', name: '', username: '', pw: '' }; render(); }
  },
  'login-del': el => {
    const u = S.data.users.get(el.dataset.id);

async function uploadPhoto(file) {
  if (!file || !S.assets || !S.modal || S.modal.type !== 'ex-edit') return;
  if (file.size > 20 * 1024 * 1024) return toast('That photo is over 20 MB. Choose a smaller one.', 'error');
  S.uploading = true; render();
  try {
    const r = await S.assets.upload(file);
    S.modal.draft.photos = [...(S.modal.draft.photos || []), 'asset:' + r.id];
    toast('Photo added. Save the exercise to keep it.');
  } catch (e) { toast('Couldn’t upload that photo. Try a JPG or PNG under 20 MB.', 'error'); }
  S.uploading = false; render();
}

/* ---------- server connection ---------- */
async function api(method, url, body, opts = {}) {
  const init = { method, credentials: 'same-origin', headers: {} };
  if (body !== undefined) {
    if (opts.raw) { init.body = body; init.headers['Content-Type'] = opts.type || 'application/octet-stream'; }
    else { init.body = JSON.stringify(body); init.headers['Content-Type'] = 'application/json'; }
  }
  let r;
  try { r = await fetch(url, init); }
  catch (e) { const err = new Error('unavailable'); err.code = 'unavailable'; throw err; }
  let j = null;
  try { j = await r.json(); } catch (e) { /* not JSON */ }
  if (!r.ok) {
    const err = new Error((j && j.error) || 'http_' + r.status);
    err.code = (j && j.error) || (r.status >= 500 ? 'unavailable' : 'http_' + r.status); err.status = r.status;
    if (r.status === 401 && !opts.quiet401 && S.meUser) signedOut('Your session ended. Sign in again.');
    throw err;
  }
  return j;
}

// A small client-side copy of the data this person may see, kept fresh by polling
// the server for changes. It offers the same calls the screens already use:
// collection(c).onSnapshot / doc(id).set / update / delete, and doc('settings/app').onSnapshot.
function makeStore() {
  const ALL = [...COLS, 'settings'];
  const cols = Object.fromEntries(ALL.map(c => [c, new Map()]));
  const subs = Object.fromEntries(ALL.map(c => [c, []]));
  const settingsSubs = [];
  let rev = 0, timer = null, live = false, inflight = null, hiddenAt = 0, loadedOnce = false;
  const snap = c => ({ docs: [...cols[c].entries()].map(([id, d]) => ({ id, data: () => d })) });
  const settingsSnap = () => { const d = cols.settings.get('app'); return { exists: !!d, data: () => d }; };
  function fire(changed) {
    for (const c of changed) {
      if (c === 'settings') settingsSubs.forEach(s => s.next(settingsSnap()));
      else (subs[c] || []).forEach(s => s.next(snap(c)));
    }
  }
  function apply(list) {
    const changed = new Set();
    for (const x of list) {
      if (!cols[x.col]) continue;
      if (x.deleted) cols[x.col].delete(x.id); else cols[x.col].set(x.id, x.data);
      changed.add(x.col);
    }
    return changed;
  }
  function sync(full) {
    if (!live) return Promise.resolve();
    if (inflight) return inflight.then(() => full ? sync(true) : undefined);
    inflight = (async () => {
      try {
        const r = await api('GET', '/api/sync?since=' + (full ? 0 : rev));
        if (!live) return;
        if (full) for (const c of ALL) cols[c] = new Map();
        const changed = apply(r.docs || []);
        if (full) ALL.forEach(c => changed.add(c));
        rev = full ? (r.rev || 0) : Math.max(rev, r.rev || 0);
        loadedOnce = true;
        fire(changed);
      } catch (e) {
        if (full && !loadedOnce) for (const c of COLS) (subs[c] || []).forEach(s => s.error && s.error(e));
      } finally { inflight = null; }
    })();
    return inflight;
  }
  const mutate = async (method, c, id, body) => {
    const r = await api(method, `/api/docs/${c}/${encodeURIComponent(id)}`, body);
    if (r && r.doc) fire(apply([r.doc]));
  };
  const docRef = (c, id) => ({
    id,
    set: data => mutate('PUT', c, id, data),
    update: data => mutate('PATCH', c, id, data),
    delete: () => mutate('DELETE', c, id),
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (live) sync(Date.now() - hiddenAt > 120000);
  });
  return {
    collection: c => ({
      doc: id => docRef(c, id),
      onSnapshot(next, error) { subs[c].push({ next, error }); if (loadedOnce) next(snap(c)); return () => {}; },
    }),
    doc: path => ({ onSnapshot(next) { settingsSubs.push({ next }); if (loadedOnce) next(settingsSnap()); return () => {}; } }),
    sync: () => sync(false),
    start() {
      live = true; rev = 0; loadedOnce = false;
      clearInterval(timer);
      timer = setInterval(() => { if (!document.hidden) sync(false); }, 10000);
      return sync(true);
    },
    stop() { live = false; clearInterval(timer); timer = null; rev = 0; loadedOnce = false; for (const c of ALL) cols[c] = new Map(); },
  };
}

// Shrink big photos in the browser before uploading (max 1400 px, JPEG).
async function shrinkPhoto(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || typeof createImageBitmap !== 'function') return file;
  try {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(bmp, 0, 0, w, h);
    const out = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
    return out && out.size < file.size ? out : file;
  } catch (e) { return file; }
}

/* ---------- data ---------- */
function subscribe(db) {
  for (const c of COLS) {
    db.collection(c).onSnapshot(snap => {
      const m = new Map();
      for (const d of snap.docs) m.set(d.id, { ...d.data(), id: d.id });
      S.data[c] = m;
      S.loaded.add(c);
      if (S.loaded.size === COLS.length) { clearTimeout(slowTimer); S.slow = false; }
      scheduleRender();
    }, err => { S.failed = true; scheduleRender(); console.warn('sync', c, err && err.code); });
  }
  db.doc('settings/app').onSnapshot(s => { if (s.exists) { S.data.settings = s.data() || {}; scheduleRender(); } });
}
let slowTimer;
function startData() {
  S.loaded = new Set(); S.failed = false; S.slow = false;
  clearTimeout(slowTimer);
  slowTimer = setTimeout(() => { if (S.meUser && S.loaded.size < COLS.length) { S.slow = true; render(); } }, 10000);
  return S.db.start();
}

async function boot() {
  S.db = makeStore();
  S.assets = { upload: async file => { const b = await shrinkPhoto(file); return api('POST', '/api/blobs', b, { raw: true, type: b.type || file.type }); } };
  subscribe(S.db);
  parseHash(); render();
  api('GET', '/api/settings', undefined, { quiet401: true }).then(r => { if (r && r.settings && !S.meUser) { S.data.settings = r.settings; render(); } }).catch(() => {});
  try {
    const r = await api('GET', '/api/me', undefined, { quiet401: true });
    S.meUser = r.user;
  } catch (e) { if (e.status !== 401) S.bootErr = true; }
  S.authChecked = true;
  if (S.meUser) { parseHash(); startData(); }
  render();
}
boot();
})();
</script>
