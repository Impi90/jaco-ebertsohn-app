# Render Blueprint: the web service plus its Postgres database, both in Frankfurt.
# Move to paid plans before a real pilot: the free database is deleted 30 days after creation unless upgraded.
databases:
  - name: jaco-db
    region: frankfurt
    plan: free
    databaseName: jaco
    user: jaco

services:
  - type: web
    name: jaco-app
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: jaco-db
          property: connectionString
