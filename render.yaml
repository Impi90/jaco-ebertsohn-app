# Render Blueprint: the web service, in Frankfurt.
# Proof of concept: the app shares Erik's existing free Postgres database (fdonc-crm-db-7dpw)
# and keeps all of its tables in its own schema, "jaco" (DB_SCHEMA), apart from the CRM's tables.
# That free database expires on 13 December 2026 unless it is upgraded to a paid plan.
# Before a real pilot, give the app its own paid database and point DATABASE_URL at it.

services:
  - type: web
    name: jaco-app
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_SCHEMA
        value: jaco
      - key: DATABASE_URL
        fromDatabase:
          name: fdonc-crm-db-7dpw
          property: connectionString
